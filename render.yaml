services:
  - type: web
    name: drama-stream-extractor-private
    runtime: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm build:render
    startCommand: pnpm start:render
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: ANCHOR_API_KEY
        sync: false
      - key: APP_ACCESS_PASSWORD
        sync: false
